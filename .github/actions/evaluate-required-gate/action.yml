name: Evaluate required gate
description: Require every detector-applicable quality lane to succeed

inputs:
  needs:
    description: JSON serialization of this workflow's needs context
    required: true
  detected:
    description: JSON object mapping fixed lane names to applicability booleans
    required: true

runs:
  using: composite
  steps:
    - name: Evaluate applicable jobs
      shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
        DETECTED: ${{ inputs.detected }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/evaluate_required_gate.mjs"
