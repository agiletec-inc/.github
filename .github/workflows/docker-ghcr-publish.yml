name: Docker GHCR Publish

# Reusable: build multi-platform image and push to ghcr.io
#   jobs:
#     publish:
#       uses: agiletec-inc/.github/.github/workflows/docker-ghcr-publish.yml@main
#       with:
#         image-name: my-image
#         dockerfile: ./Dockerfile
on:
  workflow_call:
    inputs:
      image-name:
        description: Image name (without registry prefix)
        type: string
        required: true
      dockerfile:
        description: Path to Dockerfile
        type: string
        default: Dockerfile
      context:
        description: Docker build context
        type: string
        default: .
      platforms:
        description: Target platforms
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: Push image (false = build only)
        type: boolean
        default: true

jobs:
  build-and-push:
    name: docker-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ inputs.platforms }}
