name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'
      package-manager:
        type: string
        default: auto
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      PM: ${{ inputs.package-manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate supported Node major
        shell: bash
        env:
          REQUESTED_NODE_VERSION: ${{ inputs.node-version }}
        run: |
          set -euo pipefail
          test "$REQUESTED_NODE_VERSION" = '20' || {
            echo '::error::node-version must be 20 for this public consumer adapter'
            exit 1
          }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20.20.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: inputs.package-manager == 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            *) echo "::error::unsupported package manager: $PM"; exit 1 ;;
          esac
      - name: Detect declared quality scripts
        id: scripts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const scripts = require('./package.json').scripts ?? {};
          const required = ['lint', 'typecheck', 'test', 'build'];
          const missing = required.filter((name) => !Object.hasOwn(scripts, name));
          for (const name of required) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${Object.hasOwn(scripts, name)}\n`);
          }
          if (missing.length > 0) throw new Error(`missing required package scripts: ${missing.join(', ')}`);
          NODE
      - name: Lint
        run: $PM run lint
      - name: Typecheck
        run: $PM run typecheck
      - name: Test
        run: $PM test
      - name: Build
        run: $PM run build
      - name: Audit
        run: $PM audit --audit-level=high
