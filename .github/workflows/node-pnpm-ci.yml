name: Node.js pnpm CI

# Reusable: call from any Node.js + pnpm repo with
#   jobs:
#     ci:
#       uses: agiletec-inc/.github/.github/workflows/node-pnpm-ci.yml@main
#       with:
#         node-version: '22'
#         run-command: pnpm turbo run lint typecheck test
#         runs-on: agiletec-self-hosted-runner  # omit for GitHub-hosted
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        default: '22'
      run-command:
        description: Command to run after install (lint/typecheck/test)
        type: string
        default: pnpm test
      timeout-minutes:
        description: Job timeout in minutes
        type: number
        default: 15
      frozen-lockfile:
        description: Use --frozen-lockfile flag
        type: boolean
        default: true
      runs-on:
        description: Runner label (e.g. agiletec-self-hosted-runner or ubuntu-latest)
        type: string
        default: ubuntu-latest

jobs:
  ci:
    name: ci
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
      # pnpm version is read from package.json `packageManager` field
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install ${{ inputs.frozen-lockfile && '--frozen-lockfile' || '' }}
        env:
          PNPM_FETCH_RETRIES: "5"
      - name: Run checks
        run: ${{ inputs.run-command }}
