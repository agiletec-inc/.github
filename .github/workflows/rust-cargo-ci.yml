name: Rust Cargo CI

# Reusable: cargo fmt / clippy / test / audit for Rust repos.
#   jobs:
#     ci:
#       uses: agiletec-inc/.github/.github/workflows/rust-cargo-ci.yml@<SHA>
#       with:
#         runs-on: agiletec-self-hosted-runner   # private; omit for public
#
# Resulting status-check name (for org ruleset): "ci / ci"
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-latest
      toolchain:
        description: Rust toolchain (stable / 1.xx / nightly)
        type: string
        default: stable
      timeout-minutes:
        description: Job timeout
        type: number
        default: 30
      clippy-args:
        description: Extra args appended to cargo clippy (before -- -D warnings)
        type: string
        default: --all-targets --all-features
      test-args:
        description: Extra args appended to cargo test
        type: string
        default: --all-features
      audit:
        description: Run cargo-audit (RustSec) as a gate
        type: boolean
        default: true

jobs:
  ci:
    name: ci
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (pinned)
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy ${{ inputs.clippy-args }} -- -D warnings
      - name: Test
        run: cargo test ${{ inputs.test-args }}
      - name: Audit
        if: inputs.audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
