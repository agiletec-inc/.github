name: Secret Scan

# Reusable: call from any repo with
#   jobs:
#     secret-scan:
#       uses: agiletec-inc/.github/.github/workflows/secret-scan.yml@main
#       with:
#         runs-on: agiletec-self-hosted-runner  # omit for GitHub-hosted
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (e.g. agiletec-self-hosted-runner or ubuntu-latest)
        type: string
        default: ubuntu-latest

jobs:
  gitleaks:
    name: secret-scan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
