name: Swift CI

# Reusable: swift test + release build smoke for Swift Package Manager repos.
# Runs on GitHub-hosted macOS (public repos free; Swift toolchain needs macOS).
#   jobs:
#     ci:
#       uses: agiletec-inc/.github/.github/workflows/swift-ci.yml@<SHA>
#
# Resulting status-check name (for org ruleset): "ci / ci"
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (macOS required for the Swift toolchain)
        type: string
        default: macos-latest
      timeout-minutes:
        type: number
        default: 30
      test:
        description: Run swift test
        type: boolean
        default: true
      release-build:
        description: Run `swift build -c release` smoke
        type: boolean
        default: true

jobs:
  ci:
    name: ci
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Swift version
        run: swift --version
      - name: Test
        if: inputs.test
        run: swift test
      - name: Release build smoke
        if: inputs.release-build
        run: swift build -c release
