name: CI

# Thin caller — logic lives in agiletec-inc/.github reusables.
# Produces required checks: "secret-scan / scan" and "ci / ci".
# For PRIVATE repos add `with: { runs-on: agiletec-self-hosted-runner }` to each job.
on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    uses: agiletec-inc/.github/.github/workflows/secret-scan.yml@main
  ci:
    uses: agiletec-inc/.github/.github/workflows/rust-cargo-ci.yml@main
