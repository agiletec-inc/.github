name: CI

# Thin caller — logic lives in agiletec-inc/.github reusables.
# Produces required checks: "secret-scan / scan" and "ci / ci".
# Swift CI needs macOS; public repos get hosted macOS free.
on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    uses: agiletec-inc/.github/.github/workflows/secret-scan.yml@main
  ci:
    uses: agiletec-inc/.github/.github/workflows/swift-ci.yml@main
